[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.1.0"
description = "Security scanner for MCP servers - audit capabilities, detect risks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Yunare Maia", email = "yunare@gmail.com"}
]
keywords = ["mcp", "security", "scanner", "ai-agent", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pyright>=1.1.400",
    "types-PyYAML>=6.0",
]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/mcp-guard"
Issues = "https://github.com/yunaremaia/mcp-guard/issues"

[tool.setuptools.packages.find]
include = ["mcp_guard*"]

[tool.setuptools.package-data]
mcp_guard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["mcp_guard"]

[tool.pyright]
include = ["mcp_guard"]
typeCheckingMode = "strict"
pythonVersion = "3.10"