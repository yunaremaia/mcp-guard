name: yaml-sample
version: "2.0.0"
description: MCP server config expressed in YAML (not JSON).
tools:
  - name: read_file
    description: Read the contents of a file.
    inputSchema:
      type: object
      properties:
        path:
          type: string
          description: Path to read
  - name: drop_table
    description: Drop a database table.
    auth:
      required: true
resources:
  - name: config
    description: Expose server configuration.
prompts:
  - name: summarize
    description: Summarize a piece of text.
metadata:
  origin: yaml
